<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Pink Dual-Display Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-container">
        <div class="calculator-screen">
            <div id="calculation-history" class="screen-history"></div>
            <input type="text" id="display" class="screen-main" value="0" />
        </div>
        
        <div class="calculator-keys">
            <button type="button" class="all-clear" value="all-clear">AC</button>
            <button type="button" class="operator op-btn" value="/">&divide;</button>
            <button type="button" class="operator op-btn" value="*">&times;</button>
            <button type="button" class="operator op-btn" value="-">&minus;</button>

            <button type="button" value="7">7</button>
            <button type="button" value="8">8</button>
            <button type="button" value="9">9</button>
            <button type="button" class="operator op-btn" value="+">+</button>

            <button type="button" value="4">4</button>
            <button type="button" value="5">5</button>
            <button type="button" value="6">6</button>
            <button type="button" class="equal-sign" value="=">=</button>

            <button type="button" value="1">1</button>
            <button type="button" value="2">2</button>
            <button type="button" value="3">3</button>
            <button type="button" value="0">0</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
